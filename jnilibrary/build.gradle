plugins {
    alias(libs.plugins.androidLibrary)
}

android {
    namespace 'com.example.jnilibrary'
    compileSdk 34
    ndkVersion '20.1.5948944'

    defaultConfig {
        minSdk 24

        externalNativeBuild {
            cmake {
                cppFlags "",
                        "-std=c++11",
                        "-frtti",
                        "-fexceptions",
                        "-DDEBUG",
                        "-DHAVE_ENDIAN_H"

                arguments '-DANDROID_TOOLCHAIN=clang',
                        "-DANDROID_STL=c++_static",
                        "-DANDROID_ARM_MODE=arm",     // 如果不添加，在编译 polarssl 库里 bignum 中的汇编时会报错 (*)
                        "-DANDROID_PLATFORM=android-21",
                        "-DCMAKE_BUILD_TYPE=Debug"
                // 编译类型，Release、Debug、RelWithDebInfo、MinSizeRel，不指定时默认值是 RelWithDebInfo
            }

            ndk {
                abiFilters "arm64-v8a",
                        "armeabi-v7a"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'com.github.Polidea:MultiPlatformBleAdapter:0.2.0'
    implementation 'com.squareup.okio:okio:2.4.0'
}